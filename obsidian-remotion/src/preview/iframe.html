<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            color: #fff;
            font-family: monospace;
        }

        /* ------------------------------------------------------------------ */
        /* Debug panel – floating, collapsed by default, no impact on layout   */
        /* ------------------------------------------------------------------ */
        #debug-panel {
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 9999;
            font-size: 11px;
            pointer-events: auto;
        }

        #debug-panel summary {
            cursor: pointer;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #444;
            border-radius: 4px;
            padding: 3px 8px;
            color: #0f0;
            user-select: none;
            list-style: none;
        }

        #debug-panel summary::-webkit-details-marker {
            display: none;
        }

        #debug-body {
            margin-top: 4px;
            background: rgba(10, 10, 10, 0.92);
            border: 1px solid #333;
            border-radius: 4px;
            padding: 8px 10px;
            min-width: 200px;
            color: #aaa;
        }

        .debug-item {
            margin: 3px 0;
        }

        .debug-value {
            color: #0f0;
        }

        /* ------------------------------------------------------------------ */
        /* Main layout: fills entire viewport                                  */
        /* ------------------------------------------------------------------ */
        #layout {
            position: absolute;
            inset: 0;
        }

        #bands-scroller {
            position: absolute;
            inset: 0;
            width: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        #bands-container {
            position: relative;
            width: 100%;
        }

        .preview-band {
            position: absolute;
            left: 0;
            right: 0;
            background: rgba(59, 130, 246, 0.12);
            border-left: 2px solid rgba(59, 130, 246, 0.5);
        }

        #link-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
            z-index: 3;
        }

        #widgets-scroller {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 1;
        }

        #widgets-container {
            position: relative;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px;
        }

        /* Constrain component width to fit pane */
        [data-component-name] {
            width: 100%;
            flex-shrink: 0;
            max-width: 100%;
        }

        /* Inner wrapper for aspect-ratio support */
        .component-wrapper {
            width: 100%;
            max-width: 100%;
            overflow: hidden;
            background-color: #1f1f1f;
            background-image: linear-gradient(
                45deg,
                #2b2b2b 25%,
                #1f1f1f 25%,
                #1f1f1f 50%,
                #2b2b2b 50%,
                #2b2b2b 75%,
                #1f1f1f 75%,
                #1f1f1f 100%
            );
            background-size: 24px 24px;
            background-position: 0 0;
        }

        /* Components inherit width constraint */
        .component-wrapper>* {
            display: block;
            width: 100% !important;
            max-width: 100% !important;
        }

        /* Keep common media/graphics from overflowing their wrappers */
        .component-wrapper :is(canvas, video, img, svg, iframe) {
            max-width: 100%;
            height: auto;
        }

        /* ------------------------------------------------------------------ */
        /* Loading screen                                                       */
        /* ------------------------------------------------------------------ */
        #loading-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            z-index: 5000;
        }

        #loading-screen.hidden {
            display: none;
        }

        /* ------------------------------------------------------------------ */
        /* Error overlay                                                        */
        /* ------------------------------------------------------------------ */
        #error-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 6000;
            padding: 24px;
        }

        #error-overlay.visible {
            display: flex;
        }

        #error-content {
            max-width: 800px;
            width: 100%;
            background: #2a1111;
            border: 1px solid #8a3030;
            border-radius: 6px;
            padding: 14px;
        }

        #error-title {
            color: #ff8f8f;
            font-weight: 700;
            margin-bottom: 8px;
        }

        #error-message {
            font-size: 12px;
            color: #ffd4d4;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <div id="loading-screen">
        <div>Loading…</div>
    </div>

    <div id="error-overlay">
        <div id="error-content">
            <div id="error-title">Runtime Error</div>
            <div id="error-message"></div>
        </div>
    </div>

    <!-- Floating debug panel – collapsed by default -->
    <details id="debug-panel">
        <summary>⚙ debug</summary>
        <div id="debug-body">
            <div class="debug-item">bundle size: <span class="debug-value" id="dbg-size">—</span></div>
            <div class="debug-item">eval time: <span class="debug-value" id="dbg-time">—</span></div>
            <div class="debug-item">components: <span class="debug-value" id="dbg-components">—</span></div>
        </div>
    </details>

    <div id="layout">
        <svg id="link-overlay"></svg>
        <div id="bands-scroller">
            <div id="bands-container"></div>
        </div>
        <div id="widgets-scroller">
            <div id="widgets-container"></div>
        </div>
    </div>

    <script>
        /**
         * Minimal bootstrap.
         *
         * The first `bundle` command payload is a self-contained IIFE that includes
         * obsidian-remotion-runtime/iframe (the full runtime) bundled together with
         * user code. Evaluating it registers window.__handleCommand.
         *
         * Subsequent commands are routed to __handleCommand. If it is not a function
         * after the first bundle eval the iframe posts runtime-error so tests fail loudly.
         */
        (function () {
            var sendMessage = function (msg) {
                window.parent.postMessage(msg, "*");
            };

            var dbgSize = document.getElementById("dbg-size");
            var dbgTime = document.getElementById("dbg-time");
            var dbgComponents = document.getElementById("dbg-components");

            var runtimeLoaded = false;
            var pendingCommands = [];

            function dispatch(command) {
                if (typeof window.__handleCommand !== "function") {
                    sendMessage({
                        type: "runtime-error",
                        error: {
                            message: "__handleCommand not registered – runtime bundle missing or failed to eval",
                            stack: ""
                        }
                    });
                    return;
                }
                window.__handleCommand(command);
            }

            window.addEventListener("message", function (event) {
                var command = event.data;
                if (!command || typeof command !== "object" || !command.type) return;

                if (command.type === "bundle") {
                    // Every bundle command: eval the IIFE payload.
                    // This registers/updates window.__handleCommand and
                    // populates window.__previewComponents via render() calls.
                    var t0 = performance.now();
                    try {
                        // eslint-disable-next-line no-new-func
                        (new Function(command.payload))();
                    } catch (err) {
                        sendMessage({
                            type: "runtime-error",
                            error: {
                                message: err && err.message ? err.message : String(err),
                                stack: err && err.stack ? err.stack : ""
                            }
                        });
                        return;
                    }
                    var evalMs = (performance.now() - t0).toFixed(1);
                    if (dbgSize) dbgSize.textContent = (command.payload.length / 1024).toFixed(1) + " kb";
                    if (dbgTime) dbgTime.textContent = evalMs + " ms";
                    if (dbgComponents) dbgComponents.textContent = String((window.__previewComponents || []).length);

                    if (!runtimeLoaded) {
                        runtimeLoaded = true;
                        // Replay any non-bundle commands that arrived before the first bundle
                        var queued = pendingCommands.splice(0);
                        for (var i = 0; i < queued.length; i++) {
                            dispatch(queued[i]);
                        }
                    }
                    // Dispatch the bundle command itself so __handleCommand's
                    // handleBundle() runs and mounts the registered components.
                    dispatch(command);
                    return;
                }

                if (!runtimeLoaded) {
                    // Queue non-bundle commands until runtime is ready
                    pendingCommands.push(command);
                    return;
                }

                dispatch(command);
            });

            sendMessage({ type: "runtime-ready" });
        })();
    </script>
</body>

</html>
