<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            color: #fff;
            font-family: monospace;
        }

        #debug-panel {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            background: #0a0a0a;
            border-bottom: 1px solid #333;
            padding: 12px;
            max-height: 140px;
            overflow-y: auto;
            z-index: 10;
        }

        #debug-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #0f0;
        }

        .debug-item {
            font-size: 12px;
            margin: 4px 0;
            color: #aaa;
        }

        .debug-value {
            color: #0f0;
            word-break: break-all;
        }

        #layout {
            position: absolute;
            left: 0;
            right: 0;
            top: 141px;
            bottom: 0;
            display: flex;
        }

        #bands-scroller {
            width: 12px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        #bands-container {
            position: relative;
            width: 100%;
        }

        .preview-band {
            position: absolute;
            left: 0;
            right: 0;
            background: rgba(59, 130, 246, 0.12);
            border-left: 2px solid rgba(59, 130, 246, 0.5);
        }

        #link-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        #widgets-scroller {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        #widgets-container {
            position: relative;
            min-height: 100%;
        }

        .widget-item {
            margin-bottom: 20px;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.04);
        }

        .widget-title {
            color: #0f0;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .widget-meta {
            font-size: 12px;
            color: #aaa;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .component-root {
            background: white;
            color: black;
            padding: 8px;
            border-radius: 2px;
            min-height: 40px;
        }

        #loading-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            z-index: 5000;
        }

        #loading-screen.hidden {
            display: none;
        }

        #error-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 6000;
            padding: 24px;
        }

        #error-overlay.visible {
            display: flex;
        }

        #error-content {
            max-width: 800px;
            width: 100%;
            background: #2a1111;
            border: 1px solid #8a3030;
            border-radius: 6px;
            padding: 14px;
        }

        #error-title {
            color: #ff8f8f;
            font-weight: 700;
            margin-bottom: 8px;
        }

        #error-message {
            font-size: 12px;
            color: #ffd4d4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div id="loading-screen">
        <div>Loading...</div>
    </div>

    <div id="error-overlay">
        <div id="error-content">
            <div id="error-title">Runtime Error</div>
            <div id="error-message"></div>
        </div>
    </div>

    <div id="debug-panel">
        <div id="debug-title">Debug Info</div>
        <div id="debug-content"></div>
    </div>

    <div id="layout">
        <div id="bands-scroller">
            <div id="bands-container"></div>
            <svg id="link-overlay"></svg>
        </div>
        <div id="widgets-scroller">
            <div id="widgets-container"></div>
        </div>
    </div>

    <script>
        /**
         * Bootstrap + default runtime.
         *
         * Architecture:
         *   - Provides a working default __handleCommand that reads
         *     window.__previewComponents / __previewOptions populated by
         *     render() calls in user bundles.
         *   - An optional enhanced runtime compiled into the user bundle may
         *     replace window.__handleCommand when it evaluates.
         *   - All IframeCommands are routed through window.__handleCommand so
         *     the enhanced runtime can intercept any command type.
         *
         * Command protocol (IframeCommand types):
         *   bundle     – eval user bundle, render registered components
         *   reflow     – update scroll interpolators and widget positions
         *   scroll     – sync editor scroll position
         *   reset      – clear all rendered content
         *   show-error – display error overlay
         *   clear-error– hide error overlay
         *
         * Outgoing messages (PreviewMessage types):
         *   runtime-ready  – iframe is alive (sent at boot)
         *   widget-status  – array of {height} after each bundle render
         *   widget-scroll  – iframe scroll position changed
         *   runtime-error  – bundle evaluation threw an error
         */
        (function () {
            var sendMessage = function (msg) {
                window.parent.postMessage(msg, "*");
            };

            var loadingScreen = document.getElementById("loading-screen");
            var widgetsContainer = document.getElementById("widgets-container");
            var debugContent = document.getElementById("debug-content");
            var errorOverlay = document.getElementById("error-overlay");
            var errorMessage = document.getElementById("error-message");

            var updateDebug = function (obj) {
                var html = "";
                var keys = Object.keys(obj || {});
                for (var i = 0; i < keys.length; i++) {
                    html += '<div class="debug-item"><strong>' + keys[i] + ':</strong> <span class="debug-value">' + String(obj[keys[i]]) + '</span></div>';
                }
                debugContent.innerHTML = html;
            };

            var showError = function (message, stack) {
                errorOverlay.classList.add("visible");
                errorMessage.textContent = (message || "Unknown error") + (stack ? "\n\n" + stack : "");
            };

            var hideError = function () {
                errorOverlay.classList.remove("visible");
                errorMessage.textContent = "";
            };

            var hideLoading = function () {
                loadingScreen.classList.add("hidden");
            };

            var renderRegisteredWidgets = function () {
                var components = window.__previewComponents || [];
                var options = window.__previewOptions || [];
                widgetsContainer.innerHTML = "";
                for (var i = 0; i < components.length; i++) {
                    var item = document.createElement("div");
                    item.className = "widget-item";
                    item.setAttribute("data-component-index", String(i));
                    item.innerHTML =
                        '<div class="widget-title">render() component #' + (i + 1) + '</div>' +
                        '<div class="widget-meta">' + JSON.stringify(options[i] || {}, null, 2) + '</div>';
                    widgetsContainer.appendChild(item);
                }
                var widgets = [];
                var children = widgetsContainer.children;
                for (var j = 0; j < children.length; j++) {
                    widgets.push({ height: children[j].offsetHeight || 100 });
                }
                sendMessage({ type: "widget-status", widgets: widgets });
                updateDebug({
                    registeredComponents: components.length,
                    RuntimeBundleKeys: Object.keys(window.RuntimeBundle || {}).join(", "),
                    widgetDomCount: widgetsContainer.children.length
                });
            };

            // Default handler – may be replaced by the runtime bundle
            window.__handleCommand = function (command) {
                console.log("[runtime] received command:", command.type);

                if (command.type === "bundle") {
                    hideError();
                    window.__previewComponents = [];
                    window.__previewOptions = [];
                    try {
                        // eslint-disable-next-line no-new-func
                        (new Function(command.payload))();
                        renderRegisteredWidgets();
                        hideLoading();
                    } catch (err) {
                        hideLoading();
                        var msg = err && err.message ? err.message : String(err);
                        var stk = err && err.stack ? err.stack : "";
                        showError(msg, stk);
                        sendMessage({ type: "runtime-error", error: { message: msg, stack: stk } });
                    }
                    return;
                }

                if (command.type === "reflow") {
                    window.__lastReflow = command;
                    return;
                }

                if (command.type === "scroll") {
                    window.__lastScroll = command.editorScrollTop;
                    return;
                }

                if (command.type === "reset") {
                    window.__previewComponents = [];
                    window.__previewOptions = [];
                    widgetsContainer.innerHTML = "";
                    hideError();
                    updateDebug({ status: "reset" });
                    return;
                }

                if (command.type === "show-error") {
                    showError(command.message, command.stack);
                    return;
                }

                if (command.type === "clear-error") {
                    hideError();
                    return;
                }
            };

            // Debug dump for test inspection
            window.__dumpRuntimeState = function () {
                return {
                    hasRuntimeBundle: !!window.RuntimeBundle,
                    previewComponents: (window.__previewComponents || []).length,
                    previewOptions: (window.__previewOptions || []).length,
                    widgetDomCount: widgetsContainer.children.length,
                    debugText: debugContent.textContent || "",
                    loadingHidden: loadingScreen.classList.contains("hidden"),
                    errorVisible: errorOverlay.classList.contains("visible")
                };
            };

            window.addEventListener("message", function (event) {
                var command = event.data;
                if (!command || typeof command !== "object" || !command.type) return;
                if (window.__handleCommand) {
                    window.__handleCommand(command);
                }
            });

            console.log("[runtime] Ready");
            updateDebug({ status: "ready", waitingFor: "bundle" });
            sendMessage({ type: "runtime-ready" });
        })();
    </script>
</body>

</html>
