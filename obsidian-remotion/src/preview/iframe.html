<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            color: #fff;
        }

        .scroller {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #bands-scroller {
            z-index: 1;
            overflow: hidden;
        }

        #players-scroller {
            z-index: 4;
            overflow: auto;
            pointer-events: auto;
        }

        #link-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .scrollee {
            position: absolute;
            width: 100%;
        }

        #players-container>div {
            border-radius: 4px;
            opacity: 0;
        }

        #loading-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            z-index: 5000;
        }

        #loading-screen.hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div id="loading-screen">
        <div>Loading...</div>
    </div>
    <div class="scroller" id="bands-scroller">
        <div class="scrollee" id="bands-container"></div>
    </div>
    <svg id="link-overlay"></svg>
    <div class="scroller" id="players-scroller">
        <div class="scrollee" id="players-container"></div>
    </div>
    <script>
        (function () {
            const sendMessage = (msg) => window.parent.postMessage(msg, "*");

            // Set up message handler for commands from host
            window.addEventListener("message", (event) => {
                const command = event.data;
                if (!command || typeof command !== "object") return;

                // Route commands to runtime handlers
                if (window.__remoteRuntimeReady && window.__handleCommand) {
                    window.__handleCommand(command);
                }
            });

            // Runtime initialization
            window.__remoteRuntimeReady = true;
            window.__remoteRuntime = { modules: {} };

            // This handler is called for commands from the host
            window.__handleCommand = function (command) {
                console.log('[runtime] received command:', command.type);

                if (command.type === "bundle") {
                    try {
                        // Execute the bundled code
                        const fn = new Function("window", command.payload);
                        fn(window);

                        // Check if bundle created RemotionBundle and report status
                        if (window.RemotionBundle) {
                            sendMessage({ type: "player-status", players: [] });
                        }
                    } catch (error) {
                        sendMessage({
                            type: "runtime-error",
                            error: {
                                message: error?.message ?? "Unknown error",
                                stack: error?.stack ?? ""
                            }
                        });
                    }
                }
            };

            console.log('[runtime] Ready');

            // Signal that iframe is ready
            sendMessage({ type: "runtime-ready" });
        })();
    </script>
</body>

</html>
