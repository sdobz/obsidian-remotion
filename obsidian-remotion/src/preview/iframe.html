<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            color: #fff;
            font-family: monospace;
        }

        #debug-panel {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            background: #0a0a0a;
            border-bottom: 1px solid #333;
            padding: 12px;
            max-height: 140px;
            overflow-y: auto;
            z-index: 10;
        }

        #debug-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #0f0;
        }

        .debug-item {
            font-size: 12px;
            margin: 4px 0;
            color: #aaa;
        }

        .debug-value {
            color: #0f0;
            word-break: break-all;
        }

        #widgets-scroller {
            position: absolute;
            left: 0;
            right: 0;
            top: 141px;
            bottom: 0;
            overflow: auto;
            padding: 12px;
        }

        #widgets-container {
            position: relative;
            min-height: 100%;
        }

        .widget-item {
            margin-bottom: 20px;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.04);
        }

        .widget-title {
            color: #0f0;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .widget-meta {
            font-size: 12px;
            color: #aaa;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #loading-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            z-index: 5000;
        }

        #loading-screen.hidden {
            display: none;
        }

        #error-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 6000;
            padding: 24px;
        }

        #error-overlay.visible {
            display: flex;
        }

        #error-content {
            max-width: 800px;
            width: 100%;
            background: #2a1111;
            border: 1px solid #8a3030;
            border-radius: 6px;
            padding: 14px;
        }

        #error-title {
            color: #ff8f8f;
            font-weight: 700;
            margin-bottom: 8px;
        }

        #error-message {
            font-size: 12px;
            color: #ffd4d4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .hidden {
            display: none;
        }

        .component-root {
            background: white;
            color: black;
            padding: 8px;
            border-radius: 2px;
            min-height: 40px;
        }
    </style>
</head>

<body>
    <div id="loading-screen">
        <div>Loading...</div>
    </div>
    <div id="error-overlay">
        <div id="error-content">
            <div id="error-title">Runtime Error</div>
            <div id="error-message"></div>
        </div>
    </div>
    <div id="debug-panel">
        <div id="debug-title">Debug Info</div>
        <div id="debug-content"></div>
    </div>
    <div id="widgets-scroller">
        <div id="widgets-container"></div>
    </div>

    <script>
        (function () {
            const sendMessage = (msg) => window.parent.postMessage(msg, "*");
            const loadingScreen = document.getElementById("loading-screen");
            const widgetsContainer = document.getElementById("widgets-container");
            const debugContent = document.getElementById("debug-content");
            const errorOverlay = document.getElementById("error-overlay");
            const errorMessage = document.getElementById("error-message");

            const updateDebug = (obj) => {
                const entries = Object.entries(obj || {});
                debugContent.innerHTML = entries.map(([k, v]) => (
                    `<div class="debug-item"><strong>${k}:</strong> <span class="debug-value">${String(v)}</span></div>`
                )).join("");
            };

            const showError = (message, stack) => {
                errorOverlay.classList.add("visible");
                errorMessage.textContent = `${message || "Unknown error"}\n\n${stack || ""}`;
            };

            const hideError = () => {
                errorOverlay.classList.remove("visible");
                errorMessage.textContent = "";
            };

            const hideLoading = () => {
                loadingScreen.classList.add("hidden");
            };

            const renderRegisteredWidgets = () => {
                const components = window.__previewComponents || [];
                const options = window.__previewOptions || [];
                widgetsContainer.innerHTML = "";

                components.forEach((component, index) => {
                    const item = document.createElement("div");
                    item.className = "widget-item";
                    item.setAttribute("data-component-index", String(index));
                    item.innerHTML = `
                        <div class="widget-title">render() component #${index + 1}</div>
                        <div class="widget-meta">${JSON.stringify(options[index] || {}, null, 2)}</div>
                    `;
                    widgetsContainer.appendChild(item);
                });

                const widgets = Array.from(widgetsContainer.children).map((element) => ({
                    height: element.offsetHeight || 100,
                }));

                sendMessage({ type: "widget-status", widgets });

                updateDebug({
                    registeredComponents: components.length,
                    RuntimeBundleKeys: Object.keys(window.RuntimeBundle || {}).join(", "),
                    widgetDomCount: widgetsContainer.children.length,
                });
            };

            window.__dumpRuntimeState = function () {
                return {
                    hasRuntimeBundle: !!window.RuntimeBundle,
                    previewComponents: (window.__previewComponents || []).length,
                    previewOptions: (window.__previewOptions || []).length,
                    widgetDomCount: widgetsContainer.children.length,
                    debugText: debugContent.textContent || "",
                    loadingHidden: loadingScreen.classList.contains("hidden"),
                    errorVisible: errorOverlay.classList.contains("visible"),
                };
            };

            // Set up message handler for commands from host
            window.addEventListener("message", (event) => {
                const command = event.data;
                if (!command || typeof command !== "object") return;

                // Route commands to runtime handlers
                if (window.__remoteRuntimeReady && window.__handleCommand) {
                    window.__handleCommand(command);
                }
            });

            // Runtime initialization
            window.__remoteRuntimeReady = true;
            window.__remoteRuntime = { modules: {} };

            // This handler is called for commands from the host
            window.__handleCommand = function (command) {
                console.log('[runtime] received command:', command.type);

                if (command.type === "bundle") {
                    try {
                        hideError();

                        window.__previewComponents = [];
                        window.__previewOptions = [];

                        const fn = new Function("window", command.payload);
                        fn(window);

                        renderRegisteredWidgets();
                        hideLoading();
                    } catch (error) {
                        hideLoading();
                        showError(error?.message ?? "Unknown error", error?.stack ?? "");
                        sendMessage({
                            type: "runtime-error",
                            error: {
                                message: error?.message ?? "Unknown error",
                                stack: error?.stack ?? ""
                            }
                        });
                    }
                }
            };

            console.log('[runtime] Ready');

            updateDebug({
                status: "ready",
                waitingFor: "bundle",
            });

            // Signal that iframe is ready
            sendMessage({ type: "runtime-ready" });
        })();
    </script>
</body>

</html>
